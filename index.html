<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TET Paper 2A CBT Portal | 2,699 Practice Questions & Keys</title>
  <meta http-equiv="refresh" content="0; url=app/">
  <script>
    if (!window.location.pathname.startsWith('/app')) {
      window.location.replace("app/" + window.location.search + window.location.hash);
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0e17;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 1rem;
    }
    .loader-card {
      background: rgba(19, 27, 46, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }
    .spinner {
      display: inline-block;
      width: 50px;
      height: 50px;
      border: 4px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.25rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { font-size: 1.2rem; margin-bottom: 0.5rem; font-weight: 700; }
    p { font-size: 0.9rem; color: #94a3b8; }
    a { color: #818cf8; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <div class="loader-card">
    <div class="spinner"></div>
    <h2>Loading TET Paper 2A Portal...</h2>
    <p><a href="app/">Click here if not redirected automatically</a></p>
  </div>
</body>
</html>
